<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marvel Games · The Legacy Collection</title>
<meta name="theme-color" content="#0a0604">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Big+Shoulders+Display:wght@600;800&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* STARK ARCADE · THE LEGACY COLLECTION — global styles (v1 tokens + v2 comic layer)
   Designer agent: tokens live in :root. Page-specific blocks are labelled. Do not change class names; restyle freely. */
:root{
  --bg:#0a0a0a;--panel:#18181a;--line:#2e2e30;--text:#eeeae0;--muted:#9a978e;
  --gold:#cdb87e;--ice:#8fd3ff;--good:#7bd49b;--bad:#ff8f7d;--paper:#e7e1d1;--ink:#121212;
  --cream:#f0e6bf;
  --rom:'Cinzel','Trajan Pro','Times New Roman',serif;
  --body:'EB Garamond',Georgia,'Times New Roman',serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --comic:'Bangers','Impact',system-ui,sans-serif;
  --dock:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --accent:var(--gold);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font:17px/1.4 var(--body)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--rom);font-weight:600;margin:0;line-height:1.15;letter-spacing:.03em}
.mono{font-family:var(--mono);letter-spacing:.04em}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:var(--bg)}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#stage{position:absolute;inset:0;bottom:calc(var(--dock) + var(--safe-b));transition:bottom .2s}
#app.nodock #stage{bottom:0}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:radial-gradient(120% 60% at 50% -10%,#1b1a16 0,var(--bg) 60%);overflow:hidden;will-change:transform}
.page.in-fwd{animation:inFwd .22s ease-out both}.page.in-back{animation:inBack .22s ease-out both}
.page.out-fwd{animation:outFwd .22s ease-in both}.page.out-back{animation:outBack .22s ease-in both}
@keyframes inFwd{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inBack{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes outFwd{to{transform:translateX(-40px);opacity:0}}
@keyframes outBack{to{transform:translateX(40px);opacity:0}}
.reduced .page.in-fwd,.reduced .page.in-back,.reduced .page.out-fwd,.reduced .page.out-back{animation-name:fade}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- dock ---------- */
#dock{position:absolute;left:0;right:0;bottom:0;height:calc(var(--dock) + var(--safe-b));padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr);background:#0d0d0e;border-top:1px solid var(--line);z-index:20}
#app.nodock #dock{display:none}
#dock button{display:grid;place-items:center;align-content:center;gap:3px;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-height:44px}
#dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dock button.on{color:var(--gold)}

/* ---------- panels, buttons ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--gold);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;background:var(--gold);color:#16130a;
  font:700 14px var(--rom);letter-spacing:.1em;text-transform:uppercase;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:filter .15s,transform .1s}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.o{background:#1d1c18;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%}
.link{font:12px var(--mono);letter-spacing:.08em;color:var(--gold);text-transform:uppercase;min-height:44px;display:inline-flex;align-items:center}
.lab{font:11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* ---------- top bars ---------- */
.bar{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
.bar h2{font-size:15px;letter-spacing:.2em;flex:1}
.back{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--gold);font:20px var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);font:13px var(--mono);color:var(--text)}
.chip i{width:12px;height:12px;background:var(--gold);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.avchip{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);overflow:hidden;display:grid;place-items:center;background:#1d1c18;font:700 16px var(--rom);color:var(--gold)}
.avchip img,.ava img{width:100%;height:100%;object-fit:cover}

/* ---------- splash ---------- */
.splash{align-items:center;justify-content:center;gap:18px}
.tl{position:relative;width:100%;height:60px}
.tl .rail{position:absolute;left:0;right:0;top:28px;height:1px;background:var(--line)}
.tl .fill{position:absolute;left:0;top:27px;height:3px;background:var(--gold);width:0}
.tl .pin{position:absolute;top:36px;font:10px var(--mono);color:var(--muted);transform:translateX(-50%);opacity:0;transition:opacity .2s;white-space:nowrap}
.tl .pin.on{opacity:1;color:var(--gold)}
.tl .yr{position:absolute;left:0;top:0;font:22px var(--mono);color:var(--gold)}
.tl .era{position:absolute;right:0;top:4px;font:11px var(--mono);letter-spacing:.2em;color:var(--text);opacity:0;transition:opacity .15s}
.tl .era.on{opacity:1}
.splash h1{font-size:30px;letter-spacing:.3em;opacity:0;transition:opacity .5s;text-align:center}
.splash h1.on{opacity:1}
.splash .sub{font:11px var(--mono);letter-spacing:.3em;color:var(--muted);text-transform:uppercase;opacity:0;transition:opacity .5s .2s;text-align:center}
.splash .sub.on{opacity:1}
.fine{font:9px var(--mono);color:#5d5b55;text-align:center;position:absolute;bottom:10px;left:16px;right:16px}

/* ---------- recruit ---------- */
.recruit{justify-content:center}
.recruit .panel{display:grid;gap:14px;padding:20px}
.recruit h1{font-size:20px;letter-spacing:.12em}
.fld{display:grid;gap:6px}.fld label{font:11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.fld input{height:46px;background:#101011;border:1px solid var(--line);padding:0 12px;color:var(--text);font:17px var(--body);border-radius:0}
.err{color:var(--bad);font:12px var(--mono)}

/* ---------- home ---------- */
.home{gap:8px}
.home .top{display:flex;justify-content:space-between;align-items:center;flex:none}
.hero{display:grid;justify-items:center;gap:2px;flex:none;position:relative}
.ava{width:84px;height:84px;display:grid;place-items:center;position:relative}
.ava svg.ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.ava svg.ring circle{fill:none;stroke-width:3}
.ava .face{width:100%;height:100%;display:grid;place-items:center;background:#1d1c18;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);font:700 34px var(--rom);color:var(--gold);overflow:hidden}
.skel .face{background:#222}
.hero h2.name{font-size:22px;letter-spacing:.08em;min-height:26px}
.ttl,.hero .ttl{font:12px var(--mono);color:var(--muted);letter-spacing:.1em}
.hero .welcome{font:600 13px var(--rom);letter-spacing:.22em;margin-top:8px;text-align:center}
.hero .since{font:11px var(--mono);color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.tile{position:relative;height:clamp(84px,14dvh,120px);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
  background:var(--panel);border:1px solid var(--line);overflow:hidden}
.tile svg{position:absolute;right:8px;top:8px;width:40px;height:40px;stroke:var(--gold);fill:none;stroke-width:1.4;opacity:.8}
.tile b{font:600 15px var(--rom);letter-spacing:.12em}
.tile span{font:11px var(--mono);color:var(--muted)}
.tile.news::after{content:"";position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pills{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap}
.pill{min-height:36px;padding:0 12px;border:1px solid var(--line);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.pill.flame{margin-left:auto;color:var(--gold)}
.dexdock{position:relative;display:flex;align-items:flex-end;gap:8px;flex:1;min-height:80px}
.bubble{position:relative;background:var(--cream);color:#1a1810;padding:8px 12px;font:italic 15px/1.25 var(--body);max-width:230px;border:2px solid #1a1810;align-self:center}
.bubble::before{content:"";position:absolute;left:-9px;bottom:10px;border:6px solid transparent;border-right-color:#1a1810}
.home .cta{flex:none}
.bgdots{position:absolute;inset:0;background-image:radial-gradient(rgba(205,184,126,.07) 1.5px,transparent 1.6px);background-size:6px 6px;pointer-events:none;transition:transform .15s}

/* DEX sprite (CSS pixel-art placeholder — replace art with #bot sprite from legacy if desired) */
.dex{width:var(--s,64px);height:var(--s,64px);position:relative;image-rendering:pixelated;cursor:pointer;flex:none}
.dex svg{width:100%;height:100%;display:block}
.dex.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.dex .eye{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.dex-chip{position:absolute;left:12px;bottom:12px;z-index:5;max-width:75%;background:var(--cream);color:#1a1810;border:2px solid #1a1810;padding:6px 10px;font:italic 14px var(--body);animation:fade .2s}

/* ---------- covers (comic layer) ---------- */
.cover{position:relative;aspect-ratio:3/4;border:3px solid #111;background:var(--cv-base,#1d3b8b);overflow:hidden;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .ctitle{position:absolute;left:0;right:0;top:6%;text-align:center;font:var(--comic);font-family:var(--comic);font-size:clamp(26px,9vw,44px);letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px #111;paint-order:stroke fill;text-shadow:3px 3px 0 #111;line-height:.95;padding:0 8%}
.cover .cnum{position:absolute;left:5%;top:3%;background:#f0e6bf;border:2px solid #111;padding:1px 6px;font:700 11px var(--mono);z-index:2}
.cover .cprice{position:absolute;right:5%;top:3%;background:#f0e6bf;border:2px solid #111;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font:700 11px var(--mono);z-index:2}
.cover .band{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px 10px;background:rgba(10,10,10,.82);color:var(--text);font:11px var(--mono);letter-spacing:.08em;z-index:2}
.cover.sealed{filter:grayscale(1) brightness(.55)}
.cover .seal{position:absolute;left:-10%;right:-10%;top:42%;transform:rotate(-8deg);background:#8b1e1e;color:#fff;text-align:center;font:var(--comic);font-family:var(--comic);font-size:26px;letter-spacing:.12em;padding:6px 0;border-block:3px solid #111;z-index:3}
.cover .newtag{position:absolute;right:-26px;top:16px;transform:rotate(40deg);background:var(--gold);color:#111;font:700 10px var(--mono);padding:2px 28px;z-index:4}
.cover.v-bronze::after,.cover.v-silver::after,.cover.v-gold::after,.cover.v-arc::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.cover.v-bronze::after{background:linear-gradient(135deg,rgba(176,120,60,.28),rgba(60,40,20,.25));mix-blend-mode:multiply}
.cover.v-silver::after{background:radial-gradient(rgba(0,0,0,.28) 1.4px,transparent 1.6px) 0 0/5px 5px,linear-gradient(135deg,rgba(220,230,255,.25),transparent 60%)}
.cover.v-gold::after{background:linear-gradient(115deg,transparent 30%,rgba(255,225,130,.55) 45%,transparent 60%) 0 0/250% 100%;animation:sheen 4s linear infinite}
.cover.v-arc::after{background:linear-gradient(115deg,rgba(150,200,255,.0) 20%,rgba(200,170,255,.55) 45%,rgba(120,255,220,.35) 55%,transparent 75%) 0 0/300% 100%;animation:sheen 6s linear infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-150% 0}}
.reduced .cover::after{animation:none!important}
.mini .cover{width:84px;flex:none}.mini .cover .ctitle{font-size:12px;-webkit-text-stroke:1px #111;text-shadow:1px 1px 0 #111}.mini .cover .cnum,.mini .cover .cprice,.mini .cover .band{display:none}

/* ---------- hall ---------- */
.hall .hd{flex:none}
.car{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 16px;min-height:0}
.slide .cover{height:min(58dvh,100%);max-height:calc(100% - 78px);max-width:100%}
.slide .meta{text-align:center}.slide .meta h3{font-size:18px}.slide .meta div{font:11px var(--mono);color:var(--muted)}
.arrow{position:absolute;top:44%;width:36px;height:56px;display:grid;place-items:center;color:var(--gold);font:24px var(--mono);z-index:4;background:rgba(10,10,10,.5)}
.dots{display:flex;gap:5px;justify-content:center;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
.ruler{position:relative;height:30px;flex:none;margin:4px 0 6px;border-top:1px solid var(--line)}
.ruler button{position:absolute;top:2px;transform:translateX(-50%);font:10px var(--mono);color:var(--muted);min-width:40px;min-height:24px}
.ruler .mk{position:absolute;top:-3px;width:2px;height:8px;background:var(--gold);transition:left .1s}
.hallrow{display:flex;align-items:center;gap:10px;flex:none}

/* ---------- case file ---------- */
.case .head{display:flex;gap:12px;align-items:center;flex:none}
.case .head h2{font-size:18px}
.case dl{margin:0;display:grid;gap:8px}.case dt{font:10px var(--mono);letter-spacing:.14em;color:var(--muted)}.case dd{margin:0;font:16px/1.3 var(--body)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);flex:none}
.seg button{min-height:44px;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--gold);color:#16130a}
.issues{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.iss{min-width:44px;min-height:44px;border:1px solid var(--line);display:grid;place-items:center;font:12px var(--mono);position:relative}
.iss.cur{border-color:var(--gold);color:var(--gold)}.iss.lock{opacity:.35}.iss.done{background:#1d1c18;color:var(--good)}
.iss small{position:absolute;bottom:1px;font-size:8px;color:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px}
.rank{font:700 11px var(--mono);letter-spacing:.14em;padding:2px 8px;border:1px solid currentColor}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;flex:none}

/* ---------- play, HUD, result ---------- */
.play{padding:0;background:#050505}
.hud{flex:none;padding:calc(var(--safe-t) + 6px) 12px 4px;font:12px var(--mono);letter-spacing:.08em;display:grid;gap:4px;z-index:10;background:linear-gradient(#050505,rgba(5,5,5,0))}
.hud .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud .r2{display:flex;justify-content:space-between;color:var(--muted)}
.hud .tbar{height:4px;background:#222}.hud .tbar i{display:block;height:100%;background:var(--accent);width:100%}
.hud button{min-width:44px;min-height:44px;color:var(--gold)}
.field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:rgba(5,5,5,.86);display:grid;place-items:center;align-content:center;gap:14px;text-align:center;z-index:30;padding:24px}
.ov h2{font-size:22px}
.cd{font:var(--comic);font-family:var(--comic);font-size:96px;color:var(--accent)}
.intro{background:rgba(5,5,5,.95)}
.cap{background:var(--cream);color:#1a1810;border:3px solid #111;padding:6px 12px;font:700 12px var(--mono);letter-spacing:.1em}
.nar{background:#f2d95c;color:#1a1810;border:3px solid #111;padding:10px 14px;font:italic 16px/1.25 var(--body);max-width:320px}
.twist{background:var(--gold);color:#111;padding:6px 12px;font:700 12px var(--mono);letter-spacing:.08em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.result{align-items:center;justify-content:center;text-align:center;gap:10px}
.result .big{font:700 52px var(--rom);color:var(--gold)}
.result .stamp{font:var(--comic);font-family:var(--comic);font-size:34px;letter-spacing:.1em;border:4px solid currentColor;padding:2px 16px;transform:rotate(-6deg)}
.rew{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font:13px var(--mono)}
.rew span{border:1px solid var(--line);padding:4px 10px}
.toast{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 8px);z-index:60;background:var(--cream);color:#1a1810;border:3px solid #111;padding:10px 14px;font:700 13px var(--mono);animation:toast .3s,fade .3s 3.2s reverse forwards;cursor:pointer}
@keyframes toast{from{transform:translateY(-30px);opacity:0}}

/* ---------- archive ---------- */
.drawer{display:grid;gap:4px;padding:12px 14px;text-align:left;border:1px solid var(--line);position:relative;overflow:hidden;flex:1;min-height:60px;max-height:104px}
.drawer b{font:600 15px var(--rom);letter-spacing:.14em}.drawer span{font:11px var(--mono);color:var(--muted)}
.drawer .pb{height:5px;background:#222;margin-top:2px}.drawer .pb i{display:block;height:100%;background:var(--ea,var(--gold))}
.drawer::before{content:"";position:absolute;inset:0;background:var(--eb);opacity:.28}
.drawer>*{position:relative}
.drawers{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.ent{display:grid;gap:2px;padding:12px;border:1px solid var(--line);text-align:left;margin-bottom:8px;background:var(--panel)}
.ent b{font:600 15px var(--rom)}.ent span{font:12px var(--mono);color:var(--muted)}.ent p{margin:2px 0 0;font-size:15px}
.ent.lock{opacity:.6}
.entry .art{aspect-ratio:16/9;border:3px solid #111;position:relative;overflow:hidden;flex:none}
.entry .art svg{width:100%;height:100%}
.entry h2{font-size:19px;margin-top:6px}.entry p{font-size:17px;margin:4px 0}
.cr{display:grid;gap:3px;padding:12px;border:1px solid var(--line);margin-bottom:8px}
.cr b{font:600 15px var(--rom)}.cr small{font:11px var(--mono);color:var(--muted)}.cr.lock{opacity:.45}

/* ---------- lab, ranks, profile ---------- */
.lab .tiles{flex:1;grid-auto-rows:1fr}.lab .tile{height:auto}
.frame{flex:1;min-height:0;border:0;width:100%;background:#0a0a0a}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#101011;border-top:1px solid var(--gold);padding:16px;display:grid;gap:10px;z-index:40;animation:toast .2s}
.panels{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px}
.panels::-webkit-scrollbar{display:none}
.pn{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.stones{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stone{aspect-ratio:1;border:1px solid var(--line);display:grid;place-items:center;font:10px var(--mono);color:var(--muted)}
.stone.on{color:#111;border-color:#111;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px;font:13px var(--mono)}
.kv span:nth-child(odd){color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:44px;font:13px var(--mono)}
.toggle b{border:1px solid var(--gold);padding:4px 12px;color:var(--gold)}.toggle b.on{background:var(--gold);color:#111}
.pills-h{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;padding-bottom:4px}
.pills-h button{flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);font:11px var(--mono);letter-spacing:.1em}
.pills-h button.on{background:var(--gold);color:#111}
.rows .rw{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;padding:10px 4px;border-bottom:1px solid #d6cfba;font:13px var(--mono);align-items:center}
.paper{background:var(--paper);color:var(--ink);padding:12px;display:flex;flex-direction:column;flex:1;min-height:0}
.paper h2{color:var(--ink);font-size:18px;text-align:center;margin-bottom:6px}
.me{background:#f3e6b0}

/* ---------- game-specific DOM (Hulkbuster uses canvas; Thanos is DOM) ---------- */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 14px;flex:none}
.tg{aspect-ratio:1;border:2px solid #111;background:#2b1b4a;color:#fff;display:grid;place-items:center;font:var(--comic);font-family:var(--comic);font-size:28px;position:relative}
.tg.stone{background:var(--tc,#b36bff);color:#111}.tg.dust{background:#222;color:#666}
.tg.pk{box-shadow:0 0 0 2px var(--gold)}
.thud{display:grid;gap:4px;padding:6px 14px;font:13px var(--mono);flex:none}
.pow{display:flex;gap:8px;padding:0 14px;flex:none;flex-wrap:wrap}
.pow button{min-height:44px;padding:0 10px;border:1px solid var(--gold);font:11px var(--mono);color:var(--gold)}
.pow button[disabled]{opacity:.3}
/* Avengers Assemble */
.agrid{display:grid;gap:6px;padding:8px;background:#141414;border:2px solid #111;touch-action:none;flex:none}
.ac{aspect-ratio:1;display:grid;place-items:center;align-content:center;background:var(--tc,#222);color:var(--tx,#111);border:2px solid #111;font-family:var(--comic);font-size:clamp(18px,6vw,30px);line-height:1;position:relative;overflow:hidden;min-width:0}
.ac.e{background:#222;border-color:#1a1a1a}
.ac small{font:9px var(--mono);display:block;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac.blk{background:repeating-linear-gradient(45deg,#2a2a2a 0 6px,#111 6px 12px);border-color:#000}
.ac.fz{box-shadow:inset 0 0 0 3px #bfeaff,inset 0 0 14px #8fd3ff}.ac.fz::after{content:'❄';position:absolute;top:1px;right:3px;font-size:11px}
.ac.pop{animation:acp .18s}
@keyframes acp{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-height:660px){.tile{height:76px}.ava{width:68px;height:68px}.hero .welcome{margin-top:2px}}

.home{gap:6px}.home .tile{height:clamp(76px,12dvh,112px)}.home .dexdock{min-height:70px;overflow:hidden}

body.snap-dex .dex,body.snap-dex .dexchip,body.snap-dex [class*=dex] svg{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.1)}

/* ===== TVA / MARVEL COZY THEME · phase 1 ===== */
:root{--bg:#0a0604;--panel:#160e09;--line:#4b2b17;--text:#f6e8d2;--muted:#b99468;--gold:#ff9440;--ice:#7fe0c4;--good:#6fe3b4;--bad:#ff6a4d;--paper:#ecdcbf;--ink:#1a0e07;--cream:#f3e4c8;
  --rom:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Newsreader',Georgia,serif}
body{font-size:18px}
h1,h2,h3{font-weight:800;letter-spacing:.05em;text-transform:uppercase}
#app::after{content:"";position:absolute;inset:0;z-index:80;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
.page{background:radial-gradient(90% 50% at 50% -8%,rgba(255,130,50,.22),transparent 70%),linear-gradient(rgba(255,148,64,.06) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,rgba(255,148,64,.06) 1px,transparent 1px) 0 0/26px 26px,var(--bg)}
.play{background:#060302}.hud{background:linear-gradient(#060302,rgba(6,3,2,0))}
#dock{background:linear-gradient(#120a06,#0a0604);border-top:1px solid var(--gold);box-shadow:0 -8px 24px rgba(255,120,40,.14)}
#dock button.on{text-shadow:0 0 10px rgba(255,148,64,.7)}#dock button.on svg{filter:drop-shadow(0 0 5px var(--gold))}
.panel{background:rgba(22,14,9,.9)}.panel::before,.panel::after{width:12px;height:12px}
.btn{background:linear-gradient(#ffa457,#f0762a);color:#1a0b03;font:800 18px var(--rom);letter-spacing:.12em}
.btn.o{background:rgba(255,148,64,.08);color:var(--gold)}
.chip,.pill{background:rgba(255,148,64,.06)}.fld input{background:#0e0805}
.tile{background:var(--paper);color:var(--ink);border:0;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(26,14,7,.25);pointer-events:none}
.tile svg{stroke:var(--ink);opacity:.9;width:44px;height:44px}
.tile b{color:var(--ink);font:800 21px var(--rom);letter-spacing:.08em}.tile span{color:#6a4526}
.tiles .tile:nth-child(1){background:#ff7a2f}.tiles .tile:nth-child(1) span{color:#4a1f08}
.tile.news::after{background:#e5381c;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.ava .face{background:#1f130b}
.hero h2.name{font-size:30px}.hero .welcome{font:800 15px var(--rom);letter-spacing:.3em;color:var(--gold)}
.bar h2{font-size:20px}.recruit h1{font-size:28px}.case .head h2{font-size:24px}.slide .meta h3{font-size:24px}.ov h2{font-size:30px}
.drawer b,.ent b,.cr b{font-size:19px;font-weight:800}.result .big{font:800 64px var(--rom)}
.ov{background:rgba(8,4,2,.88);backdrop-filter:blur(4px)}.nar{background:#ffb26a}
.bubble,.dex-chip{background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--gold);font:italic 500 16px/1.3 var(--body);border-radius:14px 14px 14px 4px}
.bubble::before{border-right-color:var(--ink)}
.dex{width:calc(var(--s,64px)*.9);height:var(--s,64px);image-rendering:auto;filter:drop-shadow(0 6px 14px rgba(255,120,30,.35));animation:mmbob 3.2s ease-in-out infinite}
.dex svg{overflow:visible}.dex .eye{transform-box:fill-box;transform-origin:center}
.dex.hop{animation:hop .5s}
.dex .wv{transform-box:view-box;transform-origin:100px 70px;animation:mmwave 1s ease-in-out infinite}
@keyframes mmbob{50%{transform:translateY(-4px)}}@keyframes mmwave{50%{transform:rotate(-14deg)}}
.bgdots{background-image:radial-gradient(rgba(255,148,64,.1) 1.5px,transparent 1.6px)}
.bgdots::after{content:"";position:absolute;inset:-20% 0 0;opacity:.8;animation:spark 9s linear infinite;background:radial-gradient(2px 2px at 12% 80%,#ffb26a,transparent),radial-gradient(1.5px 1.5px at 34% 60%,#ff9440,transparent),radial-gradient(2.5px 2.5px at 58% 90%,#ffd08a,transparent),radial-gradient(1.5px 1.5px at 76% 70%,#ff9440,transparent),radial-gradient(2px 2px at 90% 85%,#ffb26a,transparent)}
@keyframes spark{from{transform:translateY(30px);opacity:0}30%{opacity:.9}to{transform:translateY(-220px);opacity:0}}
.splash h1{font:800 clamp(44px,15vw,68px)/1 var(--rom);letter-spacing:.12em;background:linear-gradient(#fff 0%,#d9d4cc 38%,#8d867c 52%,#e9e3d8 70%,#9b9388);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px rgba(255,148,64,.35))}
.splash .sub{font:14px var(--mono);letter-spacing:.4em;color:var(--gold)}
.tl .rail{height:2px}.tl .fill{box-shadow:0 0 12px var(--gold)}.tl .yr{font:800 34px var(--rom);color:var(--gold)}
@media(prefers-reduced-motion:reduce){.dex,.dex .wv,.bgdots::after{animation:none!important}}
.reduced .dex,.reduced .dex .wv,.reduced .bgdots::after{animation:none!important}
</style>
